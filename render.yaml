services:
  - type: web
    name: Automailer
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: render-automailer
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LODGE_DATABASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_TLS
        sync: false
      - key: IMAP_FROM_EMAIL
        sync: false
      - key: IMAP_FROM_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: BCC_EMAIL
        sync: false
      - key: TAXI_EMAIL
        sync: false
      - key: TAXI_WHATSAPP
        sync: false
      - key: TAXI_NAME
        sync: false

  - type: web
    name: Receptionist
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: voice-reception
    # pnpm workspace: install pnpm, then install deps from lockfile, then build all packages.
    # The root build script runs typecheck + pnpm -r --if-present run build (api-server esbuild +
    # receptionist vite build). BASE_PATH defaults to "/" in vite.config.ts when not set.
    buildCommand: npm config set prefix /tmp/npm-global && npm install -g pnpm@10 && export PATH=/tmp/npm-global/bin:$PATH && pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    # Schema migrations run automatically on every startup via drizzle-orm/migrator.
    # Migration SQL files live in voice-reception/lib/db/drizzle/ (generated from the Drizzle schema).
    # No manual migration step is needed. Just set RECEPTION_DATABASE_URL and deploy.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT automatically for web services — do not set it here.
      # Required: Reception Supabase project (eu-west-3, ref rrtbnknothjiowvqxbjo).
      # Separate from the Lodge/automailer DB (LODGE_DATABASE_URL on the Automailer service).
      # Format: postgresql://postgres.<ref>:password@aws-0-eu-west-3.pooler.supabase.com:5432/postgres
      - key: RECEPTION_DATABASE_URL
        sync: false
      # Required: OpenAI credentials for voice processing.
      # AI_INTEGRATIONS_OPENAI_API_KEY  → your OpenAI secret key (sk-...)
      # AI_INTEGRATIONS_OPENAI_BASE_URL → https://api.openai.com/v1
      #   (On Replit these are injected by the AI integration; on Render set them explicitly.)
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      # Optional: override the OpenAI model names used by Mia.
      # OPENAI_REALTIME_MODEL — used for the WebRTC Realtime session (voice).
      # SDP handshake goes to https://api.openai.com/v1/realtime?model=<id>
      - key: OPENAI_REALTIME_MODEL
        value: "gpt-realtime-2"
      - key: OPENAI_TEXT_MODEL
        value: "gpt-4o"
      # Required: Beds24 auth for live availability queries
      # Use either BEDS24_TOKEN (long-lived token) or BEDS24_INVITE_CODE (one-time invite)
      - key: BEDS24_TOKEN
        sync: false
      # Optional overrides
      - key: BEDS24_PROPERTY_ID
        value: "297012"
      - key: LOG_LEVEL
        value: info
      # Optional: email alert when Marin saves a booking enquiry.
      # Use the same SMTP credentials already configured on the automailer service:
      #   NOTIFY_SMTP_HOST = automailer MAIL_HOST
      #   NOTIFY_SMTP_PORT = automailer MAIL_PORT (default 465, SSL)
      #   NOTIFY_SMTP_USER = automailer IMAP_USER
      #   NOTIFY_SMTP_PASS = automailer IMAP_PASSWORD
      - key: NOTIFY_SMTP_HOST
        sync: false
      - key: NOTIFY_SMTP_PORT
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: NOTIFY_SMTP_USER
        sync: false
      - key: NOTIFY_SMTP_PASS
        sync: false
      # Optional: WhatsApp alert via CallMeBot (set only if CallMeBot activation succeeds).
      - key: MARIN_NOTIFY_WA_PHONE
        sync: false
      - key: MARIN_NOTIFY_WA_APIKEY
        sync: false

  # Cron job: ping the Receptionist API every 10 minutes to keep it warm.
  # Even on paid plans a fresh deploy or restart cycle can leave the service cold;
  # a steady heartbeat ensures sub-2s voice startup for the first visitor after any
  # quiet period. Stays safely below Render's 15-minute inactivity threshold.
  #
  # On failure (non-2xx or network timeout) the job sends an alert email using
  # the NOTIFY_SMTP_* credentials below, then exits 1 so Render also logs the
  # failure in the cron job's own run history.
  #
  # Render dashboard uptime monitor (recommended in addition to this cron):
  #   Dashboard → <Receptionist service> → Metrics → Uptime Monitors → Add Monitor
  #   Path: /api/health  |  Interval: 1 min  |  Alert: your team email
  # This gives sub-minute alerting independent of the keep-alive cron schedule.
  #
  # After deploying, set RECEPTIONIST_URL in the Render dashboard to the external
  # URL of the Receptionist service (e.g. https://receptionist-xxxx.onrender.com).
  # No trailing slash.
  - type: cron
    name: Receptionist Keep-Alive
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/10 * * * *"
    # Install nodemailer for the alert email, then run the ping script.
    buildCommand: cd render-keepalive && npm install
    startCommand: node render-keepalive/ping.mjs
    envVars:
      - key: RECEPTIONIST_URL
        sync: false
      # NOTIFY_SMTP_* — reuse the same SMTP credentials as the Receptionist service.
      # Set all five for email alerts to fire on health-check failure; omit to
      # disable email alerts (the cron will still exit 1 and log the failure).
      - key: NOTIFY_SMTP_HOST
        sync: false
      - key: NOTIFY_SMTP_PORT
        sync: false
      - key: NOTIFY_SMTP_USER
        sync: false
      - key: NOTIFY_SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
