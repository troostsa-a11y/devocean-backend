openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: bookings
    description: Booking enquiry management
  - name: stats
    description: Dashboard statistics
security:
  - AdminBearer: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      description: Rate-limited widget bootstrap. Keep the returned private capability in browser memory; it authorizes only this conversation for 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationCreated"
        "403":
          description: Widget origin not allowed
        "429":
          description: Conversation creation quota exceeded

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/bookings:
    get:
      operationId: listConversationBookings
      tags: [bookings]
      summary: List booking enquiries linked to a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of booking enquiries for this conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      description: Guests use the opaque publicId and X-Conversation-Token. Only authenticated staff may use a numeric id. Authorization is checked before history is read or messages are saved.
      security:
        - ConversationToken: []
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "401":
          description: Missing, incorrect, expired or cross-conversation credential
        "429":
          description: Usage or concurrency quota exceeded

  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send audio and receive a streaming voice response
      description: |
        This endpoint is for gpt-audio speech-to-speech flows.
        It accepts base64 PCM WAV audio (at most 2 MB / 45 seconds).
        Guests use publicId and X-Conversation-Token; numeric ids require staff authorization.
      security:
        - ConversationToken: []
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVoiceMessageInput"
      responses:
        "200":
          description: SSE stream of transcript and audio chunks
          content:
            text/event-stream: {}
        "401":
          description: Missing, incorrect, expired or cross-conversation credential
        "429":
          description: Usage or concurrency quota exceeded

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all booking enquiries
      responses:
        "200":
          description: List of booking enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /stats:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
    ConversationToken:
      type: apiKey
      in: header
      name: X-Conversation-Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        bookingCount:
          type: integer
      required:
        - id
        - title
        - createdAt
        - messageCount
        - bookingCount

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - title

    OpenaiConversationCreated:
      allOf:
        - $ref: "#/components/schemas/OpenaiConversation"
        - type: object
          properties:
            publicId:
              type: string
              format: uuid
            conversationToken:
              type: string
              minLength: 43
              maxLength: 43
              pattern: "^[A-Za-z0-9_-]{43}$"
          required:
            - publicId
            - conversationToken

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        lang:
          type: string
          maxLength: 35
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$"
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
          description: ISO 4217 display currency preference (e.g. USD, EUR)
        pageContext:
          type: string
          maxLength: 4000
          description: >
            Optional page-context string injected by the website so Marin can
            give a specific, data-aware answer (e.g. available rooms + prices
            on the booking page, or room details on a detail page).
      required:
        - content

    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
          minLength: 60
          maxLength: 2796204
          description: Base64-encoded PCM WAV audio, at most 2 MB / 45 seconds
      required:
        - audio

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Booking:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: ["integer", "null"]
        guestName:
          type: string
        guestEmail:
          type: ["string", "null"]
        guestPhone:
          type: ["string", "null"]
        checkIn:
          type: ["string", "null"]
        checkOut:
          type: ["string", "null"]
        guests:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - guestName
        - createdAt

    BookingInput:
      type: object
      properties:
        conversationId:
          type: ["integer", "null"]
        guestName:
          type: string
        guestEmail:
          type: ["string", "null"]
        guestPhone:
          type: ["string", "null"]
        checkIn:
          type: ["string", "null"]
        checkOut:
          type: ["string", "null"]
        guests:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
      required:
        - guestName

    DashboardStats:
      type: object
      properties:
        totalConversations:
          type: integer
        totalBookings:
          type: integer
        conversationsThisWeek:
          type: integer
        bookingsThisWeek:
          type: integer
      required:
        - totalConversations
        - totalBookings
        - conversationsThisWeek
        - bookingsThisWeek
