<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <script>
      // Set the embed's declared language before its localized greeting paints.
      // The parent supplies the selected website locale, not its IP-country guess.
      (function () {
        var lang = new URLSearchParams(window.location.search).get("lang");
        if (lang) lang = lang.replace(/_/g, "-");
        if (lang && /^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i.test(lang)) {
          document.documentElement.lang = lang.replace(/_/g, "-");
        }
      })();
    </script>
